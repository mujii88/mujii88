<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 312" width="480" height="312" role="img" aria-label="VIGIL - Real-Time Global Intelligence Dashboard"><defs>
<clipPath id="r"><rect width="480" height="312" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151a2c"/></linearGradient>
<radialGradient id="rg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(300)"><stop offset="0" stop-color="#7dcfff" stop-opacity=".22"/><stop offset="1" stop-color="#7dcfff" stop-opacity="0"/></radialGradient>
