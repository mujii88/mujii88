JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7dcfff">React</text><rect x="287" y="240" width="76" height="26" rx="13" fill="#7dcfff" fill-opacity=".1" stroke="#7dcfff" stroke-opacity=".4"/><text x="325.0" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7dcfff">Three.js</text><rect x="371" y="240" width="55" height="26" rx="13" fill="#7dcfff" fill-opacity=".1" stroke="#7dcfff" stroke-opacity=".4"/><text x="398.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7dcfff">WebGL</text><text x="452" y="294" text-anchor="end" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#c0caf5">view repository<tspan fill="#7dcfff" dx="6">&#8594;<animate attributeName="dx" values="6;12;6" dur="1.6s" repeatCount="indefinite"/></tspan></text></svg>