<radialGradient id="rg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(300)"><stop offset="0" stop-color="#ff9e64" stop-opacity=".22"/><stop offset="1" stop-color="#ff9e64" stop-opacity="0"/></radialGradient>
