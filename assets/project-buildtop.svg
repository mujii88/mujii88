<line x1="28" y1="126" x2="452" y2="126" stroke="#2a3142"/><text x="28" y="152" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">A zero-dependency, concurrent Linux system profiler and</text><text x="28" y="173" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">interactive process killer built in Go with Bubbletea.</text><text x="28" y="194" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">Reads the kernel's /proc filesystem directly instead of</text><text x="28" y="215" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">wrapping OS tools.</text><rect x="28" y="240" width="34" height="26" rx="13" fill="#ff9e64" fill-opacity=".1" stroke="#ff9e64" stroke-opacity=".4"/><text x="45.0" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#ff9e64">Go</text><rect x="70" y="240" width="83" height="26" rx="13" fill="#ff9e64" fill-opacity=".1" stroke="#ff9e64" stroke-opacity=".4"/><text x="111.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#ff9e64">Bubbletea</text><rect x="161" y="240" width="55" height="26" rx="13" fill="#ff9e64" fill-opacity=".1" stroke="#ff9e64" stroke-opacity=".4"/><text x="188.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#ff9e64">Linux</text><rect x="224" y="240" width="55" height="26" rx="13" fill="#ff9e64" fill-opacity=".1" stroke="#ff9e64" stroke-opacity=".4"/><text x="251.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#ff9e64">/proc</text><text x="452" y="294" text-anchor="end" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#c0caf5">view repository<tspan fill="#ff9e64" dx="6">&#8594;<animate attributeName="dx" values="6;12;6" dur="1.6s" repeatCount="indefinite"/></tspan></text></svg>