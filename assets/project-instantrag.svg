<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 312" width="480" height="312" role="img" aria-label="InstantRAG - RAG-as-a-Service Platform"><defs>
<clipPath id="r"><rect width="480" height="312" rx="18"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#151a2c"/></linearGradient>
<radialGradient id="rg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(300)"><stop offset="0" stop-color="#7aa2f7" stop-opacity=".22"/><stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<g clip-path="url(#r)"><rect width="480" height="312" fill="url(#bg)"/><rect width="480" height="312" fill="url(#rg)"/></g>
<rect x=".5" y=".5" width="479" height="311" rx="18" fill="none" stroke="#2a3142"/>
<rect x="1" y="1" width="478" height="310" rx="17" fill="none" stroke="#7aa2f7" stroke-width="4" stroke-opacity=".55" stroke-dasharray="150 1403.1" filter="url(#gl)"><animate attributeName="stroke-dashoffset" from="0" to="-1553.1" dur="7s" repeatCount="indefinite"/></rect>
<rect x="1" y="1" width="478" height="310" rx="17" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="150 1403.1"><animate attributeName="stroke-dashoffset" from="0" to="-1553.1" dur="7s" repeatCount="indefinite"/></rect>
<text x="28" y="46" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" font-weight="700" fill="#7aa2f7">01</text>
<text x="52" y="46" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#7a88b8">/ python</text>
<circle cx="444" cy="41" r="4" fill="#7aa2f7"/>
<circle cx="444" cy="41" r="4" fill="none" stroke="#7aa2f7"><animate attributeName="r" values="4;14" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="28" y="86" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="25" font-weight="800" fill="#e6edf3">InstantRAG</text>
<text x="28" y="110" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" letter-spacing=".9" fill="#7aa2f7">RAG-AS-A-SERVICE PLATFORM</text>
<line x1="28" y1="126" x2="452" y2="126" stroke="#2a3142"/><text x="28" y="152" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">Deploy context-aware knowledge bots from raw PDFs with</text><text x="28" y="173" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">no custom backend. Documents are chunked, embedded and</text><text x="28" y="194" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">stored in Pinecone, then answered via LangChain + Gemini</text><text x="28" y="215" font-family="'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#a9b4d6">2.5, with 5-10s query response.</text><rect x="28" y="240" width="62" height="26" rx="13" fill="#7aa2f7" fill-opacity=".1" stroke="#7aa2f7" stroke-opacity=".4"/><text x="59.0" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7aa2f7">Python</text><rect x="98" y="240" width="69" height="26" rx="13" fill="#7aa2f7" fill-opacity=".1" stroke="#7aa2f7" stroke-opacity=".4"/><text x="132.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7aa2f7">FastAPI</text><rect x="175" y="240" width="76" height="26" rx="13" fill="#7aa2f7" fill-opacity=".1" stroke="#7aa2f7" stroke-opacity=".4"/><text x="213.0" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7aa2f7">Pinecone</text><rect x="259" y="240" width="83" height="26" rx="13" fill="#7aa2f7" fill-opacity=".1" stroke="#7aa2f7" stroke-opacity=".4"/><text x="300.5" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7aa2f7">LangChain</text><rect x="350" y="240" width="62" height="26" rx="13" fill="#7aa2f7" fill-opacity=".1" stroke="#7aa2f7" stroke-opacity=".4"/><text x="381.0" y="257" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11.5" fill="#7aa2f7">Gemini</text><text x="452" y="294" text-anchor="end" font-family="'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#c0caf5">view repository<tspan fill="#7aa2f7" dx="6">&#8594;<animate attributeName="dx" values="6;12;6" dur="1.6s" repeatCount="indefinite"/></tspan></text></svg>